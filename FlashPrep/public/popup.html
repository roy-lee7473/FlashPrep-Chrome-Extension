<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Chrome Extension</title>
    <link rel="stylesheet" href="../src/popup.css" />
</head>
<body>
  <div class="app">
    <div class="topImages">
      <button class="settingsButton imageButton">
        <img src="images/settings.png" alt="Settings Button" />
      </button>
      <button class="exitButton imageButton">
        <img src="images/exit.png" alt="Exit Button" />
      </button>
      <img class="logo" src="icons/icon_128.png" alt="FlashPrep Logo" />
    </div>
    
    <div class="button-container">
      <button id="readDocumentButton" class="button">Read Page</button>
    </div>
    <p id="textTitle" class="title">Extracted Text:</p>
    <div>
      <p id="extractedText" class="outputTextBox">Click the "Read Page" Button to extract this webpage's text</p>
    </div>
  </div>

  <script src="../src/popup.js"></script>

  <!--
    This HTML file opens when you click on icon from the toolbar.

    To begin the development, run `npm run watch`.
    To create a production bundle, use `npm run build`.
  -->
</body>
</html>
